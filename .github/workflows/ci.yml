name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    env:
      APPLICATION_ID: "1"
      GUILD_ID: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Ruff
        run: pip install ruff==0.12.4

      - name: Check installed dependencies
        run: pip check

      - name: Run Ruff
        run: ruff check .

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Import main
        run: python -c "import main"

      - name: Import all Cogs
        run: >-
          python -c "import importlib, main;
          [importlib.import_module(name) for name in main.COGS]"
